name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Permisos para GitHub Pages y despliegue OIDC
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # v7.8: Regenerar el índice temático (all_afg_topics.json + js/data.js) desde fuentes/.
      # Cualquier cambio en fuentes/*.md se refleja en la página tras el git push, sin pasos manuales.
      - name: Regenerar índice temático desde fuentes/ (generate_clean_notes_data.py)
        run: python3 generate_clean_notes_data.py

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Cargar artefactos web estáticos
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4