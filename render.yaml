services:
  - type: web
    name: gradomania-app
    env: python
    region: oregon
    plan: starter
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    buildCommand: pip install -r requirements.txt
    startCommand: python -u server.py
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: PORT
        value: 8080
      - key: SESSION_SECRET
        generateValue: true
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: ALLOW_TEST_AUTH
        value: "0"
      - key: EXTRA_ACCESS_CODES
        sync: false
      - key: DB_PATH
        value: /var/data/estudio_grado.db

